<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adinda Zhara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="min-h-screen flex items-center justify-center relative overflow-hidden"
  >
    <!-- Bubbles -->
    <div
      class="bubble w-24 h-24 top-10 left-10"
      style="animation-delay: 0s"
    ></div>
    <div
      class="bubble w-32 h-32 bottom-20 right-20"
      style="animation-delay: 1s"
    ></div>
    <div
      class="bubble w-16 h-16 top-1/3 right-1/4"
      style="animation-delay: 2s"
    ></div>
    <div
      class="bubble w-40 h-40 bottom-10 left-1/4"
      style="animation-delay: 3s"
    ></div>
    <div
      class="bubble w-20 h-20 top-1/2 left-1/2"
      style="animation-delay: 4s"
    ></div>

    <!-- Butterflies -->
    <div class="butterfly butterfly-path-1" style="top: 15%; left: 10%">
      <div
        class="butterfly-wing left pink"
        style="
          background-image: linear-gradient(to bottom, #ff77f7, #ff1493);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
      <div class="butterfly-body"></div>
      <div
        class="butterfly-wing right pink"
        style="
          background-image: linear-gradient(to bottom, #ff77f7, #ff1493);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
    </div>

    <div class="butterfly butterfly-path-2" style="top: 45%; right: 15%">
      <div
        class="butterfly-wing left blue"
        style="
          background-image: linear-gradient(to bottom, #59cdff, #00a2ff);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
      <div class="butterfly-body"></div>
      <div
        class="butterfly-wing right blue"
        style="
          background-image: linear-gradient(to bottom, #59cdff, #00a2ff);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
    </div>

    <div class="butterfly butterfly-path-3" style="bottom: 30%; left: 30%">
      <div
        class="butterfly-wing left pink"
        style="
          background-image: linear-gradient(to bottom, #ff77f7, #ff1493);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
      <div class="butterfly-body"></div>
      <div
        class="butterfly-wing right pink"
        style="
          background-image: linear-gradient(to bottom, #ff77f7, #ff1493);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
    </div>

    <!-- Tambahkan lebih banyak kupu-kupu -->
    <div
      class="butterfly butterfly-path-1"
      style="top: 25%; right: 30%; animation-delay: -7s"
    >
      <div
        class="butterfly-wing left blue"
        style="
          background-image: linear-gradient(to bottom, #59cdff, #00a2ff);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
      <div class="butterfly-body"></div>
      <div
        class="butterfly-wing right blue"
        style="
          background-image: linear-gradient(to bottom, #59cdff, #00a2ff);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
    </div>

    <div
      class="butterfly butterfly-path-2"
      style="bottom: 20%; right: 25%; animation-delay: -3s"
    >
      <div
        class="butterfly-wing left pink"
        style="
          background-image: linear-gradient(to bottom, #ff77f7, #ff1493);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
      <div class="butterfly-body"></div>
      <div
        class="butterfly-wing right pink"
        style="
          background-image: linear-gradient(to bottom, #ff77f7, #ff1493);
          border: 1px solid rgba(255, 255, 255, 0.6);
        "
      ></div>
    </div>

    <!-- Card -->
    <div
      class="relative z-10 bg-white/10 backdrop-blur-lg rounded-3xl p-8 shadow-2xl border border-white/20 animate-float"
    >
      <div class="max-w-2xl mx-auto text-center">
        <!-- Foto Adinda Zhara -->
        <div class="mb-8 flex justify-center">
          <div
            class="photo-frame rounded-full overflow-hidden h-48 w-48 md:h-64 md:w-64"
          >
            <!-- Ganti URL gambar dengan URL foto Adinda Zhara yang sebenarnya -->
            <img
              src="assets/zara.jpg"
              alt="Foto Adinda Zhara"
              class="h-full w-full object-cover"
              onerror="this.src='https://placehold.co/400x400/ffe6f2/e94057?text=Adinda+Zhara'"
            />
          </div>
        </div>

        <h1
          class="text-5xl md:text-7xl font-extrabold mb-6 animate-pulse-custom text-gradient tracking-wider"
        >
          ADINDA ZHARA CANTIK
        </h1>

        <div class="mt-10 flex justify-center space-x-4">
          <span
            class="inline-block bg-pink-500 rounded-full px-5 py-2 text-white font-semibold shadow-lg hover:bg-pink-600 transition-all duration-300 transform hover:scale-105"
            >✨ Cantik</span
          >
          <span
            class="inline-block bg-purple-500 rounded-full px-5 py-2 text-white font-semibold shadow-lg hover:bg-purple-600 transition-all duration-300 transform hover:scale-105"
            >🌟 Memukau</span
          >
          <span
            class="inline-block bg-blue-500 rounded-full px-5 py-2 text-white font-semibold shadow-lg hover:bg-blue-600 transition-all duration-300 transform hover:scale-105"
            >💕 Menawan</span
          >
        </div>

        <div class="mt-12">
          <p class="text-white/90 text-lg">
            Website ini dibuat khusus untuk merayakan kecantikan Adinda Zhara
          </p>
        </div>
      </div>
    </div>

    <!-- Animated background elements -->
    <div class="absolute top-0 left-0 w-full h-full -z-10">
      <div
        class="absolute top-0 right-0 w-96 h-96 bg-pink-500/30 rounded-full filter blur-3xl"
      ></div>
      <div
        class="absolute bottom-0 left-0 w-96 h-96 bg-purple-500/30 rounded-full filter blur-3xl"
      ></div>
      <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-blue-500/30 rounded-full filter blur-3xl"
      ></div>
    </div>
  </body>
</html>
